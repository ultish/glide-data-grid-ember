# Deploy the test-app demo to GitHub Pages.
# Repo Settings → Pages → Source: GitHub Actions
name: Deploy demo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build addon
        run: pnpm --filter glide-data-grid-ember build

      - name: Build test-app
        env:
          # Project site: https://<owner>.github.io/<repo>/
          ROOT_URL: /${{ github.event.repository.name }}/
        run: pnpm --filter test-app build

      # history location: unknown paths fall back to the SPA shell
      - name: SPA fallback for GitHub Pages
        run: cp test-app/dist/index.html test-app/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: test-app/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
